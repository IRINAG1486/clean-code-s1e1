<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
  <header class="header">
    <figure>
      <img class="heder__picture" src="./eisenhower-matrix.jpg" alt="eisenhower's-matrix">
      <figcaption>
        <a class="header__inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </figcaption>
    </figure>  
  </header>
  <main class="center">
    <section class="add-task" id='topSectionForAddingElementToList'>
      <h3 class="title">Add Item</h3>
      <!-- <label for="new-task">Add Item</label> -->
      <div class="task-row-wrapper">
        <input id='new-task'class="task" type="text">
        <button>Add</button>
      </div>
    </section>
    <section>
      <h3 class="title">Todo</h3>
      <ul class="list" id="incompleteTasks">
        <li class="list__elem">
          <input type="checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="button-delete">
          </button>
        </li>
        <li class="list__elem editMode">
          <input type="checkbox">
          <label class="task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task">
          <button class="edit">Save</button>
          <button class="delete">
            <img src="./remove.svg" alt="button-delete">
          </button></li>
      </ul>
    </section>
    <section>
      <h3 class="title">Completed</h3>
      <ul class="list" id="completed-tasks">
        <li class="list__elem">
          <input type="checkbox" checked>
          <label class="task">See the Doctor</label>
          <input type="text" class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="button-delete">
          </button>
        </li>
      </ul>
    </section>
    
  </main>
<script src="app.js"></script>
</body>
</html>
